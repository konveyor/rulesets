name: Trigger seed in tackle2-hub

on:
  push:
    branches:
      - main
      - 'release-*'

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      rules_changed: ${{ steps.filter.outputs.rules_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rules_changed:
              - 'stable/**/*.yaml'
              - '!**/*.test.yaml'

  trigger-seed:
    needs: filter
    if: needs.filter.outputs.rules_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Get Token
        id: get_workflow_token
        uses: peter-murray/workflow-application-token-action@v4
        with:
          application_id: ${{ vars.KONVEYOR_BOT_ID }}
          application_private_key: ${{ secrets.KONVEYOR_BOT_KEY }}
          # Permission needed to send repository_dispatch
          permissions: "contents:write"
          revoke_token: true
      - name: Dispatch event to create seed PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.get_workflow_token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const repoUrl = context.payload.repository.html_url;
            const fullMessage = (context.payload.head_commit || {}).message || '';
            // The merged rulesets PR title is the first line of the merge/squash commit message.
            const commitSubject = fullMessage.split('\n')[0];
            // Resolve the merged PR number: squash merges end with "(#123)";
            // merge commits start with "Merge pull request #123".
            const match = fullMessage.match(/\(#(\d+)\)/) || fullMessage.match(/#(\d+)/);
            const prNumber = match ? parseInt(match[1], 10) : null;

            const payload = {
              branch: context.ref.replace('refs/heads/', ''),
              repo: `${owner}/${repo}`,
              commit_subject: commitSubject,
              pr_number: prNumber,
              pr_url: prNumber ? `${repoUrl}/pull/${prNumber}` : '',
            };

            core.info(`Dispatching trigger-seed to konveyor/tackle2-seed:\n${JSON.stringify(payload, null, 2)}`);
            await github.rest.repos.createDispatchEvent({
              owner: 'konveyor',
              repo: 'tackle2-seed',
              event_type: 'trigger-seed',
              client_payload: payload,
            });
