- category: mandatory
  customVariables:
  - name: renamed
    nameOfCaptureGroup: renamed
    pattern: javax.(?P<renamed>(activation|annotation|batch|decorator|ejb|el|enterprise|faces|inject|interceptor|jms|json|jws|mail|persistence|resource|security|servlet|transaction|validation|websocket|ws|xml))?.*
  description: The package 'javax' has been replaced by 'jakarta'.
  effort: 1
  labels:
  - konveyor.io/target=jakarta-ee9+
  - konveyor.io/target=jakarta-ee
  - konveyor.io/target=eap8
  - konveyor.io/target=eap
  - konveyor.io/target=jws6+
  - konveyor.io/target=jws
  - konveyor.io/source=spring5
  - konveyor.io/target=spring6+
  - konveyor.io/source
  links: []
  message: Replace the `javax.{{renamed}}` import statement with `jakarta.{{renamed}}`
  ruleID: javax-to-jakarta-import-00001
  when:
    as: javaClass
    java.referenced:
      location: IMPORT
      pattern: javax.(activation|batch|decorator|ejb|el|enterprise|faces|inject|interceptor|jms|json|jws|mail|persistence|resource|servlet|validation|websocket|ws.rs|xml.bind|xml.soap|xml.ws|annotation.Generated|annotation.ManagedBean|annotation.PostConstruct|annotation.PreDestroy|annotation.Priority|annotation.Resource|annotation.Resources|annotation.security|annotation.sql|security.auth.message|security.enterprise|security.jacc|transaction.Heuristic|transaction.InvalidTransactionException|transaction.NotSupportedException|transaction.RollbackException|transaction.Status|transaction.Synchronization|transaction.SystemException|transaction.Transaction|transaction.UserTransaction)*
