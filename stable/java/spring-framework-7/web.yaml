- ruleID: web-import-00080
  description: Auto-opts-in for system proxy properties in Spring Framework 7.0
  category: potential
  effort: 3
  labels:
    - konveyor.io/source=spring-framework6
    - konveyor.io/source=spring-framework
    - konveyor.io/target=spring-framework7
    - konveyor.io/target=spring-framework
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The Reactor client (when used with `WebClient`) now automatically opts in for system proxy configuration properties in Spring Framework 7.0.

    ### Migration Steps

    If your application uses `WebClient` with the Reactor client:

    1. Review your proxy configuration
    2. Be aware that `https.proxyHost` and `https.proxyPort` system properties are now automatically applied
    3. If you need to override or disable this behavior, configure the client explicitly:

    ```java
    import org.springframework.web.reactive.function.client.WebClient;
    import reactor.netty.http.client.HttpClient;

    HttpClient httpClient = HttpClient.create()
        .proxyWithSystemProperties(false); // Disable system proxy properties

    WebClient webClient = WebClient.builder()
        .clientConnector(new ReactorClientHttpConnector(httpClient))
        .build();
    ```

    ### Additional Info

    - The change applies specifically to the Reactor Netty client
    - System properties `https.proxyHost` and `https.proxyPort` are now honored by default
    - This improves out-of-the-box proxy support for most environments
    - See [#34850](https://github.com/spring-projects/spring-framework/pull/34850) for more details
  links:
    - url: https://github.com/spring-projects/spring-framework/pull/34850
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.web.reactive.function.client.WebClient
        location: IMPORT
- ruleID: web-import-00090
  description: AntPathMatcher is deprecated for HTTP request mappings; PathPattern is now the default
  category: optional
  effort: 3
  labels:
    - konveyor.io/source=spring-framework6
    - konveyor.io/source=spring-framework
    - konveyor.io/target=spring-framework7
    - konveyor.io/target=spring-framework
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    As of Spring Framework 7.0, the legacy `AntPathMatcher` for matching HTTP request mappings is being deprecated. Spring Framework has been migrating to `PathPattern` since version 5.0, and it is now the default for HTTP request mapping.

    ### Before

    ```java
    import org.springframework.util.AntPathMatcher;

    public class PathMatchingConfig {
        public AntPathMatcher pathMatcher() {
            return new AntPathMatcher();
        }
    }
    ```

    ### After

    ```java
    import org.springframework.web.util.pattern.PathPattern;
    import org.springframework.web.util.pattern.PathPatternParser;

    public class PathMatchingConfig {
        public PathPatternParser pathPatternParser() {
            return new PathPatternParser();
        }
    }
    ```

    ### Additional Info

    - `PathPattern` has been the default for HTTP request mappings since Spring Framework 5.0
    - Spring Framework 7.0 adds support for matching many path segments at the beginning of the path (e.g., `"/**/pages/index.html"`), which was a missing feature that prevented some upgrades
    - `PathPattern` provides better performance and more precise matching compared to `AntPathMatcher`
    - If you're using `AntPathMatcher` explicitly in your code for HTTP request mapping, consider migrating to `PathPattern` and `PathPatternParser`
    - For non-HTTP use cases (e.g., file path matching), `AntPathMatcher` remains valid
    - See the [request mapping documentation](https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html#mvc-ann-requestmapping-uri-templates) for allowed patterns
  links:
    - url: https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-7.0-Release-Notes#pathpattern-matching-improved
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.util.AntPathMatcher
        location: IMPORT
- ruleID: web-import-00100
  description: WebMvcConfigurer.configureMessageConverters method signature changed to use HttpMessageConverters.ServerBuilder
  category: potential
  effort: 5
  labels:
    - konveyor.io/source=spring-framework6
    - konveyor.io/source=spring-framework
    - konveyor.io/target=spring-framework7
    - konveyor.io/target=spring-framework
    - konveyor.io/generated-by=ai-rule-gen
  message: "Spring Framework 7.0 introduces the new `HttpMessageConverters` class for easier and centralized HTTP message converter configuration, similar to the codecs configuration on the reactive side.\n\n### Method Signature Change\n\nThe `WebMvcConfigurer.configureMessageConverters()` method signature has changed to accept an `HttpMessageConverters.ServerBuilder` parameter instead of a `List<HttpMessageConverter<?>>`. \n\n### Before\n\n```java\nimport org.springframework.context.annotation.Configuration;\nimport org.springframework.http.converter.HttpMessageConverter;\nimport org.springframework.web.servlet.config.annotation.WebMvcConfigurer;\nimport java.util.List;\n\n@Configuration\npublic class WebConfiguration implements WebMvcConfigurer {\n    @Override\n    public void configureMessageConverters(List<HttpMessageConverter<?>> converters) {\n        // Configure converters\n    }\n}\n```\n\n### After\n\n```java\nimport org.springframework.context.annotation.Configuration;\nimport org.springframework.http.converter.HttpMessageConverters;\nimport org.springframework.http.converter.json.JacksonJsonHttpMessageConverter;\nimport org.springframework.web.servlet.config.annotation.WebMvcConfigurer;\nimport com.fasterxml.jackson.databind.json.JsonMapper;\nimport com.fasterxml.jackson.databind.SerializationFeature;\nimport java.text.SimpleDateFormat;\n\n@Configuration\npublic class WebConfiguration implements WebMvcConfigurer {\n    @Override\n    public void configureMessageConverters(HttpMessageConverters.ServerBuilder builder) {\n        JsonMapper jsonMapper = JsonMapper.builder()\n                .findAndAddModules()\n                .enable(SerializationFeature.INDENT_OUTPUT)\n                .defaultDateFormat(new SimpleDateFormat(\"yyyy-MM-dd\"))\n                .build();\n        builder.jsonMessageConverter(new JacksonJsonHttpMessageConverter(jsonMapper));\n    }\n}\n```\n\n### Additional Info\n\n- The new `HttpMessageConverters.ServerBuilder` provides a fluent API for configuring message converters\n- Similar methods exist for `RestClient` and `RestTemplate` configuration\n- The new approach provides better classpath detection and global setup capabilities\n- Check the [WebMvcConfigurer JavaDoc](https://docs.spring.io/spring-framework/docs/7.0.0/javadoc-api/org/springframework/web/servlet/config/annotation/WebMvcConfigurer.html#configureMessageConverters%28org.springframework.http.converter.HttpMessageConverters.ServerBuilder%29)"
  links:
    - url: https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-7.0-Release-Notes#easier-message-converters-configuration-with-httpmessageconverters
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.web.servlet.config.annotation.WebMvcConfigurer
        location: IMPORT
