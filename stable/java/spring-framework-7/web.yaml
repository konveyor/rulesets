- ruleID: web-method-00010
  description: Removed in Spring Framework 7.0
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=spring-framework6
    - konveyor.io/source=spring-framework
    - konveyor.io/target=spring-framework7
    - konveyor.io/target=spring-framework
    - konveyor.io/generated-by=ai-rule-gen
  message: "The `HttpComponentsClientHttpRequestFactory.setConnectTimeout()` methods have been removed in Spring Framework 7.0.\n\n### Before\n\n```java\nimport org.springframework.http.client.HttpComponentsClientHttpRequestFactory;\n\nHttpComponentsClientHttpRequestFactory factory = new HttpComponentsClientHttpRequestFactory();\nfactory.setConnectTimeout(5000);\n```\n\n### After\n\n```java\nimport org.springframework.http.client.HttpComponentsClientHttpRequestFactory;\nimport org.apache.hc.client5.http.config.RequestConfig;\nimport java.util.concurrent.TimeUnit;\n\nRequestConfig config = RequestConfig.custom()\n    .setConnectTimeout(5000, TimeUnit.MILLISECONDS)\n    .build();\n    \nHttpComponentsClientHttpRequestFactory factory = new HttpComponentsClientHttpRequestFactory();\nfactory.setHttpClient(HttpClientBuilder.create()\n    .setDefaultRequestConfig(config)\n    .build());\n```\n\n### Additional Info\n\n- Configure timeouts directly on the HttpClient instance via `RequestConfig`\n- This aligns with the Apache HttpComponents 5.x configuration model\n- See [#35748](https://github.com/spring-projects/spring-framework/issues/35748) for more details"
  links:
    - url: https://github.com/spring-projects/spring-framework/issues/35748
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.http.client.HttpComponentsClientHttpRequestFactory.setConnectTimeout
        location: METHOD_CALL
- ruleID: web-import-00030
  description: No longer extends MultiValueMap in Spring Framework 7.0
  category: potential
  effort: 5
  labels:
    - konveyor.io/source=spring-framework6
    - konveyor.io/source=spring-framework
    - konveyor.io/target=spring-framework7
    - konveyor.io/target=spring-framework
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The `HttpHeaders` class has been revisited in Spring Framework 7.0 and no longer extends the `MultiValueMap` contract.

    ### Migration Steps

    1. If you were using `HttpHeaders` as a `MultiValueMap`, use the new `HttpHeaders.asMultiValueMap()` method (note: this method is immediately deprecated as a fallback)
    2. Consider using other `HttpHeaders` methods instead of map-like operations:
       - Use `add(String, String)` instead of map `put()` operations
       - Use `get(String)` for header retrieval
       - Use `set(String, String)` for setting headers

    ### Additional Info

    - Headers are case-insensitive, so map-like operations don't behave well
    - Many map-like operations have been removed for performance and correctness
    - The `asMultiValueMap()` fallback is deprecated and should only be used temporarily
    - Underlying servers treat headers as collections of pairs, not as a traditional map
    - See [#33913](https://github.com/spring-projects/spring-framework/issues/33913) for more details
  links:
    - url: https://github.com/spring-projects/spring-framework/issues/33913
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.http.HttpHeaders
        location: IMPORT
- ruleID: web-import-00040
  description: Deprecated in Spring Framework 7.0 documentation
  category: optional
  effort: 5
  labels:
    - konveyor.io/source=spring-framework6
    - konveyor.io/source=spring-framework
    - konveyor.io/target=spring-framework7
    - konveyor.io/target=spring-framework
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    `RestTemplate` has been deprecated in the Spring Framework 7.0 reference documentation and will be officially marked as `@Deprecated` in Spring Framework 7.1.

    ### Migration Steps

    Migrate to modern alternatives:

    1. **For blocking HTTP clients:** Use `RestClient`

    ```java
    // Before
    RestTemplate restTemplate = new RestTemplate();
    String result = restTemplate.getForObject("https://api.example.com/data", String.class);

    // After
    RestClient restClient = RestClient.create();
    String result = restClient.get()
        .uri("https://api.example.com/data")
        .retrieve()
        .body(String.class);
    ```

    2. **For reactive HTTP clients:** Use `WebClient`

    ```java
    WebClient webClient = WebClient.create();
    Mono<String> result = webClient.get()
        .uri("https://api.example.com/data")
        .retrieve()
        .bodyToMono(String.class);
    ```

    ### Additional Info

    - `RestTemplate` is now in maintenance mode and will not receive new features
    - `RestClient` provides a modern, fluent API for blocking HTTP calls
    - `WebClient` is the recommended option for reactive applications
    - See [the state of HTTP clients blog post](https://spring.io/blog/2025/09/30/the-state-of-http-clients-in-spring) for more details
  links:
    - url: https://spring.io/blog/2025/09/30/the-state-of-http-clients-in-spring
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.web.client.RestTemplate
        location: IMPORT
- ruleID: web-import-00050
  description: No Jackson 3.x equivalent; Jackson 2.x deprecated
  category: optional
  effort: 5
  labels:
    - konveyor.io/source=spring-framework6
    - konveyor.io/source=spring-framework
    - konveyor.io/target=spring-framework7
    - konveyor.io/target=spring-framework
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    `Jackson2ObjectMapperBuilder` has no Jackson 3.x equivalent. Jackson 2.x support has been deprecated in Spring Framework 7.0.

    ### Migration Steps

    Migrate to Jackson 3.x native builders:

    ### Before (Jackson 2.x with Spring builder)

    ```java
    import org.springframework.http.converter.json.Jackson2ObjectMapperBuilder;
    import com.fasterxml.jackson.databind.ObjectMapper;

    ObjectMapper mapper = Jackson2ObjectMapperBuilder.json()
        .indentOutput(true)
        .build();
    ```

    ### After (Jackson 3.x native builder)

    ```java
    import tools.jackson.databind.json.JsonMapper;

    JsonMapper mapper = JsonMapper.builder()
        .enable(SerializationFeature.INDENT_OUTPUT)
        .build();
    ```

    ### Additional Info

    - Jackson 3.x uses the `tools.jackson` package instead of `com.fasterxml.jackson`
    - Annotation classes like `@JsonView` remain in `com.fasterxml.jackson` for easier migration
    - Use `JsonMapper.builder()`, `CBORMapper.builder()`, and others as replacements
    - Spring will disable Jackson 2.x auto-detection in 7.1 and remove support in 7.2
    - See [Introducing Jackson 3 support in Spring blog post](https://spring.io/blog/2025/10/07/introducing-jackson-3-support-in-spring) for details
  links:
    - url: https://spring.io/blog/2025/10/07/introducing-jackson-3-support-in-spring
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.http.converter.json.Jackson2ObjectMapperBuilder
        location: IMPORT
- ruleID: web-import-00060
  description: Deprecated in Spring MVC in Spring Framework 7.0
  category: optional
  effort: 5
  labels:
    - konveyor.io/source=spring-framework6
    - konveyor.io/source=spring-framework
    - konveyor.io/target=spring-framework7
    - konveyor.io/target=spring-framework
    - konveyor.io/generated-by=ai-rule-gen
  message: "The use of `PathMatcher` in Spring MVC has been deprecated in Spring Framework 7.0.\n\n### Migration Steps\n\nMigrate to `PathPattern` for path matching in Spring MVC:\n\n```java\n// Before\nimport org.springframework.util.PathMatcher;\nimport org.springframework.util.AntPathMatcher;\n\nPathMatcher matcher = new AntPathMatcher();\nboolean matches = matcher.match(\"/api/**/users\", \"/api/v1/users\");\n\n// After  \nimport org.springframework.web.util.pattern.PathPattern;\nimport org.springframework.web.util.pattern.PathPatternParser;\n\nPathPatternParser parser = new PathPatternParser();\nPathPattern pattern = parser.parse(\"/api/**/users\");\nboolean matches = pattern.matches(PathContainer.parsePath(\"/api/v1/users\"));\n```\n\n### Additional Info\n\n- `PathPattern` is more efficient and provides better performance\n- Spring MVC now uses `PathPattern` by default for path matching\n- `PathMatcher` remains available for non-MVC use cases but is deprecated in MVC context\n- See [#34018](https://github.com/spring-projects/spring-framework/issues/34018) for more details"
  links:
    - url: https://github.com/spring-projects/spring-framework/issues/34018
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.util.PathMatcher
        location: IMPORT
