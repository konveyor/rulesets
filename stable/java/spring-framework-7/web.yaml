- ruleID: web-import-00010
  description: Removed in Spring Framework 7.0
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=spring-framework6
    - konveyor.io/source=spring-framework
    - konveyor.io/target=spring-framework7
    - konveyor.io/target=spring-framework
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The `PathExtensionContentNegotiationStrategy` class has been removed in Spring Framework 7.0 as part of the removal of deprecated path mapping options.

    ### Migration Steps

    1. Remove any explicit configuration of `PathExtensionContentNegotiationStrategy`
    2. Remove `favorPathExtension` and `ignoreUnknownPathExtensions` configuration from `ContentNegotiationManagerFactoryBean`
    3. Use other content negotiation strategies such as:
       - `HeaderContentNegotiationStrategy` (Accept header)
       - `ParameterContentNegotiationStrategy` (query parameter)
       - `FixedContentNegotiationStrategy` (fixed media type)

    ### Additional Info

    - Path extension-based content negotiation was deprecated in Spring Framework 6.0
    - This feature was considered a security risk and has been fully removed
    - Use the `Accept` header or query parameter for content negotiation instead
    - Related configuration options `suffixPatternMatch`, `registeredSuffixPatternMatch`, `trailingSlashMatch`, and `matchOptionalTrailingSeparator` have also been removed
  links:
    - url: https://github.com/spring-projects/spring-framework/blob/main/framework-docs/modules/ROOT/pages/web/webmvc/mvc-config/content-negotiation.adoc
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.web.accept.PathExtensionContentNegotiationStrategy
        location: IMPORT
