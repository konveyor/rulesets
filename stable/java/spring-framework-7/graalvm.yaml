- ruleID: graalvm-change-00030
  description: Review ExecutableMode usage for deprecated INTROSPECT
  category: optional
  effort: 1
  labels:
    - konveyor.io/source=spring-framework6
    - konveyor.io/source=spring-framework
    - konveyor.io/target=spring-framework7
    - konveyor.io/target=spring-framework
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Spring Framework 7.0 deprecated `ExecutableMode.INTROSPECT` with no replacement needed.

    **Review your ExecutableMode usage** - if using `INTROSPECT`, it can be removed as type hints now imply introspection automatically.

    ### Before

    ```java
    hints.reflection().registerType(MyType.class)
        .withMembers(memberCategory -> memberCategory
            .withMode(ExecutableMode.INTROSPECT));
    ```

    ### After

    ```java
    hints.reflection().registerType(MyType.class);
    ```

    Registering a type hint now implies methods, constructors, and fields introspection by default. Use `ExecutableMode.INVOKE` only when you need to actually invoke methods/constructors.
  links:
    - url: https://github.com/spring-projects/spring-framework/issues/33847
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.aot.hint.ExecutableMode
        location: IMPORT
