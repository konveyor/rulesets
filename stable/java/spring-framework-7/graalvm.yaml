    Spring Framework 7.0 deprecated `MemberCategory.PUBLIC_FIELDS` in favor of `MemberCategory.INVOKE_PUBLIC_FIELDS` to align with the unified GraalVM reachability metadata format.

    **Review your MemberCategory usage** - if using `PUBLIC_FIELDS`, replace with `INVOKE_PUBLIC_FIELDS` or use a simple type hint for introspection-only cases.

    ### Before

    ```java
    hints.reflection().registerType(MyType.class, MemberCategory.PUBLIC_FIELDS);
    ```

    ### After

    For field invocation:
    ```java
    hints.reflection().registerType(MyType.class, MemberCategory.INVOKE_PUBLIC_FIELDS);
    ```

    For introspection only:
    ```java
    hints.reflection().registerType(MyType.class);
    ```
