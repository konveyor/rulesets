- ruleID: dependencies-dependency-00010
  description: Removed in Spring Framework 7.0
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=spring-framework6
    - konveyor.io/source=spring-framework
    - konveyor.io/target=spring-framework7
    - konveyor.io/target=spring-framework
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The `spring-jcl` module has been removed in Spring Framework 7.0 in favor of Apache Commons Logging 1.3.0.

    This change should be transparent for most applications, as `spring-jcl` was a transitive dependency. The logging API calls should not change.

    ### Migration Steps

    1. Remove any explicit `spring-jcl` dependency declarations from your `pom.xml` or `build.gradle`
    2. Ensure Apache Commons Logging 1.3.0 is available (it will be pulled transitively by Spring Framework 7.0)
    3. No code changes should be necessary

    ### Additional Info

    - The migration is primarily at the dependency level
    - Logging API usage remains compatible
    - Apache Commons Logging 1.3.0 is the direct replacement
    - See [#32459](https://github.com/spring-projects/spring-framework/issues/32459) for more details
  links:
    - url: https://github.com/spring-projects/spring-framework/issues/32459
      title: Migration Documentation
  when:
    java.dependency:
        name: org.springframework.spring-jcl
        upperbound: 6.2.999
- ruleID: dependencies-dependency-00020
  description: Removed in favor of webjars-locator-lite
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=spring-framework6
    - konveyor.io/source=spring-framework
    - konveyor.io/target=spring-framework7
    - konveyor.io/target=spring-framework
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    WebJars support with `org.webjars:webjars-locator-core` has been removed in Spring Framework 7.0 in favor of `org.webjars:webjars-locator-lite`.

    ### Migration Steps

    1. Replace the dependency in your `pom.xml`:

    ```xml
    <!-- Remove -->
    <dependency>
        <groupId>org.webjars</groupId>
        <artifactId>webjars-locator-core</artifactId>
    </dependency>

    <!-- Add -->
    <dependency>
        <groupId>org.webjars</groupId>
        <artifactId>webjars-locator-lite</artifactId>
    </dependency>
    ```

    2. Or in your `build.gradle`:

    ```gradle
    // Remove
    implementation 'org.webjars:webjars-locator-core'

    // Add
    implementation 'org.webjars:webjars-locator-lite'
    ```

    ### Additional Info

    - The lite version is lighter-weight and has fewer dependencies
    - The API is compatible, so no code changes should be required
    - See [#33809](https://github.com/spring-projects/spring-framework/issues/33809) for more details
  links:
    - url: https://github.com/spring-projects/spring-framework/issues/33809
      title: Migration Documentation
  when:
    java.dependency:
        name: org.webjars.webjars-locator-core
        upperbound: 999.999.999
- ruleID: dependencies-dependency-00030
  description: Spring Retry functionality is now built into spring-core; remove external spring-retry dependency
  category: optional
  effort: 1
  labels:
    - konveyor.io/source=spring-framework6
    - konveyor.io/source=spring-framework
    - konveyor.io/target=spring-framework7
    - konveyor.io/target=spring-framework
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Spring Framework 7.0 includes core retry functionality built into the `spring-core` module. If you're only using basic retry features (RetryTemplate, RetryPolicy, @Retryable), you can remove the external `spring-retry` dependency.

    ### Migration Steps

    1. Update imports from `org.springframework.retry.*` to `org.springframework.core.retry.*`
    2. Remove the `spring-retry` dependency from your POM or Gradle file:

    **Maven:**
    ```xml
    <!-- Remove this dependency if only using core retry features -->
    <dependency>
        <groupId>org.springframework.retry</groupId>
        <artifactId>spring-retry</artifactId>
    </dependency>
    ```

    **Gradle:**
    ```groovy
    // Remove this dependency if only using core retry features
    implementation 'org.springframework.retry:spring-retry'
    ```

    ### Additional Info

    - The Spring Framework team trimmed unnecessary features during the merge, so advanced Spring Retry features may not be available in the core framework version
    - If your application uses advanced Spring Retry features not available in spring-core, you may need to keep the external dependency
    - The new `@EnableResilientMethods` annotation in spring-context enables both `@Retryable` and `@ConcurrencyLimit` support
    - See the [resilience documentation](https://docs.spring.io/spring/reference/core/resilience.html)
  links:
    - url: https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-7.0-Release-Notes#resilience-features-retrytemplate-retryable-concurrencylimit
      title: Migration Documentation
  when:
    java.dependency:
        name: org.springframework.retry.spring-retry
        lowerbound: 0.0.0
