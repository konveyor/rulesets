- category: mandatory
  customVariables: []
  description: Hibernate Session.save() was removed in Hibernate ORM 7
  effort: 1
  labels:
  - konveyor.io/source=java-ee
  - konveyor.io/source=jakarta-ee
  - konveyor.io/target=quarkus
  links:
  - title: Hibernate ORM 7 on Quarkus
    url: https://quarkus.io/blog/hibernate7-on-quarkus/
  - title: Quarkus Hibernate ORM Guide
    url: https://quarkus.io/guides/hibernate-orm
  message: |-
    Quarkus 3.40 ships Hibernate ORM 7, which removed the deprecated `Session.save()` method.
    Replace `session.save(entity)` with the Jakarta Persistence `session.persist(entity)` method.
  ruleID: hibernate-orm7-to-quarkus-00010
  when:
    java.referenced:
      location: METHOD_CALL
      pattern: org.hibernate.Session.save*
