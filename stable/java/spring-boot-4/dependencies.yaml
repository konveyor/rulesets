- ruleID: dependencies-dependency-00010
  description: spring-boot-starter-oauth2-authorization-server renamed to spring-boot-starter-security-oauth2-authorization-server
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=spring-boot3
    - konveyor.io/source=spring-boot
    - konveyor.io/target=spring-boot4
    - konveyor.io/target=spring-boot
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The `spring-boot-starter-oauth2-authorization-server` starter has been renamed to `spring-boot-starter-security-oauth2-authorization-server` for better alignment with its corresponding module.

    ### Migration Steps

    1. Update your Maven POM or Gradle build file
    2. Replace the old starter dependency with the new one
    3. No code changes are required - the starter provides the same functionality

    ### Additional Info

    - The old starter remains available in Spring Boot 4.0 but is deprecated
    - The old starter will be removed in a future release
    - The new name better reflects that this is a Spring Security module
    - This change is part of a broader effort to improve starter naming consistency
  links:
    - url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#deprecated-starters
      title: Migration Documentation
  when:
    java.dependency:
        name: org.springframework.boot.spring-boot-starter-oauth2-authorization-server
        lowerbound: 0.0.0
