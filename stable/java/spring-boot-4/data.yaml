- ruleID: data-dependency-00030
  description: No longer provides defaults for UUID and BigDecimal representations
  category: potential
  effort: 5
  labels:
    - konveyor.io/source=spring-boot3
    - konveyor.io/source=spring-boot
    - konveyor.io/target=spring-boot4
    - konveyor.io/target=spring-boot
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Spring Data MongoDB no longer provides defaults for `UUID` and `BigInteger`/`BigDecimal` representations.

    ### Migration Steps
    - Explicitly configure UUID representation using `spring.mongodb.representation.uuid` property
    - Explicitly configure BigDecimal representation using `spring.data.mongodb.representation.big-decimal` property
    - Choose appropriate representations for your use case

    ### Additional Info
    - This aligns with the MongoDB driver recommendation to not favor a particular representation
    - Avoids representation changes caused by upgrades to newer Spring Data versions
    - Explicit configuration ensures consistent behavior across versions
    - See [Migration Guide](https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#mongodb-uuid-and-bigdecimal-representations)
  links:
    - url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#mongodb-uuid-and-bigdecimal-representations
      title: Migration Documentation
  when:
    java.dependency:
        name: org.springframework.data.spring-data-mongodb
        upperbound: 5.0.0
- ruleID: data-dependency-00040
  description: hibernate-jpamodelgen replaced by hibernate-processor
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=spring-boot3
    - konveyor.io/source=spring-boot
    - konveyor.io/target=spring-boot4
    - konveyor.io/target=spring-boot
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Hibernate dependency management has been updated to account for module relocations.

    ### Before
    ```xml
    <dependency>
        <groupId>org.hibernate</groupId>
        <artifactId>hibernate-jpamodelgen</artifactId>
    </dependency>
    ```

    ### After
    ```xml
    <dependency>
        <groupId>org.hibernate</groupId>
        <artifactId>hibernate-processor</artifactId>
    </dependency>
    ```

    ### Additional Info
    - `hibernate-jpamodelgen` has been replaced by `hibernate-processor`
    - Update your dependencies to use the new artifact name
    - See [Migration Guide](https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#hibernate-dependency-management)
  links:
    - url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#hibernate-dependency-management
      title: Migration Documentation
  when:
    java.dependency:
        name: org.hibernate.orm.hibernate-jpamodelgen
        lowerbound: 0.0.0
