- ruleID: data-change-00010
  description: RestClientBuilderCustomizer replaced by Rest5ClientBuilderCustomizer
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=spring-boot3
    - konveyor.io/source=spring-boot
    - konveyor.io/target=spring-boot4
    - konveyor.io/target=spring-boot
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The low-level Elasticsearch `RestClient` has been deprecated. Auto-configuration now uses the new `Rest5Client`.

    ### Before
    ```java
    import org.springframework.boot.autoconfigure.elasticsearch.RestClientBuilderCustomizer;
    import org.elasticsearch.client.RestClientBuilder;

    @Bean
    public RestClientBuilderCustomizer customizer() {
        return builder -> builder.setRequestConfigCallback(
            requestConfigBuilder -> requestConfigBuilder.setConnectTimeout(5000)
        );
    }
    ```

    ### After
    ```java
    import org.springframework.boot.autoconfigure.elasticsearch.Rest5ClientBuilderCustomizer;
    import co.elastic.clients.transport.rest_client.RestClientBuilder;

    @Bean
    public Rest5ClientBuilderCustomizer customizer() {
        return builder -> builder.setRequestConfigCallback(
            requestConfigBuilder -> requestConfigBuilder.setConnectTimeout(5000)
        );
    }
    ```

    ### Additional Info
    - Update imports to use `Rest5ClientBuilderCustomizer` instead of `RestClientBuilderCustomizer`
    - The new client is part of Elasticsearch's consolidated client library
    - Higher-level `ElasticsearchClient` and `ReactiveElasticsearchClient` remain supported
    - See [Migration Guide](https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#elasticsearch-client)
  links:
    - url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#elasticsearch-client
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.boot.autoconfigure.elasticsearch.RestClientBuilderCustomizer
        location: TYPE
- ruleID: data-dependency-00010
  description: Removed in favor of consolidated co.elastic.clients module
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=spring-boot3
    - konveyor.io/source=spring-boot
    - konveyor.io/target=spring-boot4
    - konveyor.io/target=spring-boot
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The Elasticsearch client code has been consolidated in the `co.elastic.clients:elasticsearch-java` module.

    ### Before
    ```xml
    <dependency>
        <groupId>org.elasticsearch.client</groupId>
        <artifactId>elasticsearch-rest-client</artifactId>
    </dependency>
    ```

    ### After
    ```xml
    <dependency>
        <groupId>co.elastic.clients</groupId>
        <artifactId>elasticsearch-java</artifactId>
    </dependency>
    ```

    ### Additional Info
    - `org.elasticsearch.client:elasticsearch-rest-client` is no longer required
    - `org.elasticsearch.client:elasticsearch-rest-client-sniffer` is also no longer required
    - The new consolidated module includes built-in sniffer support
    - Spring Boot's dependency management has been updated accordingly
    - See [Migration Guide](https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#elasticsearch-client)
  links:
    - url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#elasticsearch-client
      title: Migration Documentation
  when:
    java.dependency:
        name: org.elasticsearch.client.elasticsearch-rest-client
        lowerbound: 0.0.0
