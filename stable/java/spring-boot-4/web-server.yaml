- ruleID: web-server-dependency-00010
  description: Undertow support removed in Spring Boot 4
  category: mandatory
  effort: 7
  labels:
    - konveyor.io/source=spring-boot3
    - konveyor.io/source=spring-boot
    - konveyor.io/target=spring-boot4
    - konveyor.io/target=spring-boot
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Spring Boot 4 requires a Servlet 6.1 baseline, with which Undertow is not yet compatible. Undertow support has been dropped, including the Undertow starter and the ability to use Undertow as an embedded server.

    ### Migration Steps

    1. Remove the `spring-boot-starter-undertow` dependency from your `pom.xml` or `build.gradle`
    2. Switch to a Servlet 6.1 compliant embedded server:
       - For Tomcat (recommended): add `spring-boot-starter-tomcat`
       - For Jetty: add `spring-boot-starter-jetty`
    3. Test your application thoroughly as different embedded servers may have different behavior

    ### Additional Info

    - Spring Boot does not recommend deploying Spring Boot 4.0 applications to non-Servlet 6.1 compliant containers
    - Tomcat and Jetty both support Servlet 6.1 in their latest versions
    - Review any Undertow-specific configuration in your application
    - If you have custom Undertow configuration beans, these will need to be replaced with equivalent configuration for your new embedded server
  links:
    - url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#undertow
      title: Migration Documentation
  when:
    java.dependency:
        name: org.springframework.boot.spring-boot-starter-undertow
        upperbound: 3.5.999
