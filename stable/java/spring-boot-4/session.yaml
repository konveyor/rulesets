- ruleID: session-dependency-00010
  description: Spring Session Hazelcast support removed from Spring Boot
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=spring-boot3
    - konveyor.io/source=spring-boot
    - konveyor.io/target=spring-boot4
    - konveyor.io/target=spring-boot
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Spring Session Hazelcast is now under the leadership of the Hazelcast team. Direct support for Spring Session Hazelcast has been removed from Spring Boot.

    ### Migration Steps

    1. Spring Session Hazelcast continues to be maintained by the Hazelcast team
    2. You will need to manage the dependency version explicitly in your `pom.xml` or `build.gradle`
    3. Spring Boot no longer provides auto-configuration or dependency management for Spring Session Hazelcast
    4. Refer to the [Spring Session Hazelcast announcement](https://spring.io/blog/2025/10/14/spring-session-hazelcast-new-leadership) for migration guidance

    ### Additional Info

    - The Spring Session Hazelcast library itself is still actively maintained
    - You may need to configure Spring Session Hazelcast manually without Spring Boot auto-configuration
    - Consider alternative session storage solutions that have Spring Boot 4 support (Redis, JDBC, etc.)
    - Test session persistence thoroughly after migration
  links:
    - url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#spring-session-hazelcast
      title: Migration Documentation
  when:
    java.dependency:
        name: org.springframework.session.spring-session-hazelcast
        upperbound: 3.5.999
- ruleID: session-dependency-00020
