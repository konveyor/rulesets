    Spring Session Data MongoDB properties have been renamed to reflect the dependency on Spring Data MongoDB.

    ### Migration Steps
    - Rename all properties from `spring.session.mongodb.*` to `spring.session.data.mongodb.*`
    - Example: `spring.session.mongodb.collection-name` → `spring.session.data.mongodb.collection-name`

    ### Additional Info
