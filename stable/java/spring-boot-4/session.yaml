- ruleID: session-pattern-00010
  description: Spring Session Redis properties renamed to spring.session.data.redis
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=spring-boot3
    - konveyor.io/source=spring-boot
    - konveyor.io/target=spring-boot4
    - konveyor.io/target=spring-boot
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Spring Session Data Redis properties have been renamed to reflect the dependency on Spring Data Redis.

    ### Migration Steps
    - Rename all properties from `spring.session.redis.*` to `spring.session.data.redis.*`
    - Example: `spring.session.redis.namespace` → `spring.session.data.redis.namespace`
    - Example: `spring.session.redis.flush-mode` → `spring.session.data.redis.flush-mode`

    ### Additional Info
    - This change aligns property names with the underlying Spring Data Redis dependency
    - All Redis session properties follow this pattern
    - See [Migration Guide](https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#spring-session)
  links:
    - url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#spring-session
      title: Migration Documentation
  when:
    builtin.filecontent:
        pattern: spring\.session\.redis\.
        filePattern: application.*\.(properties|ya?ml)
- ruleID: session-pattern-00020
  description: Spring Session MongoDB properties renamed to spring.session.data.mongodb
  category: mandatory
