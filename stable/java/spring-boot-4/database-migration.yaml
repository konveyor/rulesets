    Spring Boot 4 has a new modular design. Technologies like Liquibase that previously only required the third-party dependency now need a Spring Boot starter for proper integration.

    ### Migration Steps

    1. Replace the direct `org.liquibase:liquibase-core` dependency with `spring-boot-starter-liquibase` in your `pom.xml`:
