- ruleID: json-import-00040
  description: Renamed to JsonMapperBuilderCustomizer
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=spring-boot3
    - konveyor.io/source=spring-boot
    - konveyor.io/target=spring-boot4
    - konveyor.io/target=spring-boot
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    `Jackson2ObjectMapperBuilderCustomizer` has been renamed to `JsonMapperBuilderCustomizer` for consistency with Jackson 3.

    ### Before

    ```java
    import org.springframework.boot.autoconfigure.jackson.Jackson2ObjectMapperBuilderCustomizer;
    import org.springframework.context.annotation.Bean;

    @Bean
    public Jackson2ObjectMapperBuilderCustomizer customizer() {
        return builder -> {
            builder.featuresToEnable(SerializationFeature.INDENT_OUTPUT);
        };
    }
    ```

    ### After

    ```java
    import org.springframework.boot.autoconfigure.jackson.JsonMapperBuilderCustomizer;
    import org.springframework.context.annotation.Bean;

    @Bean
    public JsonMapperBuilderCustomizer customizer() {
        return builder -> {
            builder.featuresToEnable(SerializationFeature.INDENT_OUTPUT);
        };
    }
    ```

    ### Additional Info

    - The interface functionality remains the same
    - This is part of Spring Boot's alignment with Jackson 3
    - Update any bean definitions that customize the ObjectMapper builder
  links:
    - url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#upgrading-jackson
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.boot.autoconfigure.jackson.Jackson2ObjectMapperBuilderCustomizer
        location: IMPORT
- ruleID: json-annotation-00010
  description: Renamed to @JacksonComponent
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=spring-boot3
    - konveyor.io/source=spring-boot
    - konveyor.io/target=spring-boot4
    - konveyor.io/target=spring-boot
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    `@JsonComponent` has been renamed to `@JacksonComponent` to clarify that it's specific to Jackson and not necessarily limited to JSON.

    ### Before

    ```java
    import org.springframework.boot.jackson.JsonComponent;

    @JsonComponent
    public class MySerializer extends JsonSerializer<MyType> {
        // ...
    }
    ```

    ### After

    ```java
    import org.springframework.boot.jackson.JacksonComponent;

    @JacksonComponent
    public class MySerializer extends JsonSerializer<MyType> {
        // ...
    }
    ```

    ### Additional Info

    - The annotation functionality remains the same
    - The new name clarifies this is Jackson-specific, not a generic JSON component
    - Update all custom serializers and deserializers using this annotation
  links:
    - url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#upgrading-jackson
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.boot.jackson.JsonComponent
        location: ANNOTATION
