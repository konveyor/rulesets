- ruleID: json-import-00010
  description: Package renamed from com.fasterxml.jackson to tools.jackson
  category: mandatory
  effort: 7
  labels:
    - konveyor.io/source=spring-boot3
    - konveyor.io/source=spring-boot
    - konveyor.io/target=spring-boot4
    - konveyor.io/target=spring-boot
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Spring Boot 4 uses Jackson 3, which uses new group IDs and package names. The package `com.fasterxml.jackson` becomes `tools.jackson`. An exception is `jackson-annotations`, which continues to use `com.fasterxml.jackson.core` group ID and `com.fasterxml.jackson.annotation` package.

    ### Before

    ```java
    import com.fasterxml.jackson.databind.ObjectMapper;
    import com.fasterxml.jackson.core.JsonProcessingException;
    import com.fasterxml.jackson.databind.JsonNode;
    ```

    ### After

    ```java
    import tools.jackson.databind.ObjectMapper;
    import tools.jackson.core.JsonProcessingException;
    import tools.jackson.databind.JsonNode;

    // Exception: annotations remain in com.fasterxml.jackson
    import com.fasterxml.jackson.annotation.JsonProperty;
    ```

    ### Additional Info

    - For libraries requiring Jackson 2, dependency management remains available
    - A Jackson 2 `ObjectMapper` can coexist with Boot's Jackson 3 auto-configuration
    - Spring Boot provides a `spring-boot-jackson2` compatibility module (deprecated, temporary)
    - Review the [Jackson 3.0 release notes](https://github.com/FasterXML/jackson/wiki/Jackson-Release-3.0#major-changesfeatures-in-30)
    - The `jackson-annotations` module is the only exception to the package rename
  links:
    - url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#upgrading-jackson
      title: Migration Documentation
  when:
    java.referenced:
        pattern: com.fasterxml.jackson*
        location: PACKAGE
- ruleID: json-import-00020
  description: Renamed to ObjectValueSerializer
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=spring-boot3
    - konveyor.io/source=spring-boot
    - konveyor.io/target=spring-boot4
    - konveyor.io/target=spring-boot
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    `JsonObjectSerializer` has been renamed to `ObjectValueSerializer` for consistency with Jackson 3.

    ### Before

    ```java
    import org.springframework.boot.jackson.JsonObjectSerializer;

    public class MySerializer extends JsonObjectSerializer<MyType> {
        // ...
    }
    ```

    ### After

    ```java
    import org.springframework.boot.jackson.ObjectValueSerializer;

    public class MySerializer extends ObjectValueSerializer<MyType> {
        // ...
    }
    ```

    ### Additional Info

    - The class functionality remains the same
    - This is part of Spring Boot's alignment with Jackson 3 naming conventions
    - Update any custom serializers extending this class
  links:
    - url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#upgrading-jackson
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.springframework.boot.jackson.JsonObjectSerializer
        location: IMPORT
